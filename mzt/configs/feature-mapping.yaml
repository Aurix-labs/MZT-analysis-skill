# 可选阅读线索，保留原文件名以便已有引用定位。
# 这些条目不是“问题类别 -> 必选方法”的执行配置，也不是回答结构。
# 遇到理解障碍时可以参考；不匹配、跳过、交叉阅读和放弃某个视角都有效。
# 当前仓库没有据此自动调用方法的执行器。

purpose: optional_reading_cues
automatic_selection: false
required_methods: []

reading_cues:
  - uncertainty: 不同现象似乎相互牵制，但尚不清楚实际关系
    possible_references:
      - ../methodologies/01-contradiction-analysis.md
      - ../methodologies/21-concrete-analysis.md
    reminder: 先理解对象和机制；材料不足时不强行命名主要矛盾。

  - uncertainty: 当前解释可能把推测或过去经验当成事实
    possible_references:
      - ../methodologies/02-seek-truth-from-facts.md
      - ../methodologies/06-investigation-research.md
    reminder: 具体事件要追查现实与历史，核对原始主张和后续变化；已有材料足够时无需重复检索。

  - uncertainty: 争论中的转述可能改变了原始问题
    possible_references:
      - ../methodologies/06-investigation-research.md
      - ../references/evidence-and-dialogue.md
    reminder: 对照对象、范围、程度、条件和比较对象；论题替换与故意操纵需要不同证据。

  - uncertainty: 当前强弱或规模被直接用来推定长期结果
    possible_references:
      - ../methodologies/04-development-dialectics.md
      - ../methodologies/09-strategic-dialectics.md
    reminder: 转化取决于具体条件，时间和新生身份都不保证胜利。

  - uncertainty: 表面立场遮住了各方承担的成本和约束
    possible_references:
      - ../methodologies/05-class-stance-analysis.md
      - ../methodologies/13-mass-line.md
      - ../methodologies/18-united-front.md
    reminder: 主动查经济和组织联系、持续行动及制度效果；既不以传闻推断动机，也不回避已有利益证据。

  - uncertainty: 局部投入很多但整体处境没有改善
    possible_references:
      - ../methodologies/11-focus-breakthrough.md
      - ../methodologies/12-overall-coordination.md
    reminder: 理解投入怎样改变约束，同时考察支持条件和转移的代价。

  - uncertainty: 计划看似自洽，却不知道什么结果会改变认识
    possible_references:
      - ../methodologies/03-practice-cycle.md
      - ../methodologies/19-criticism-self-criticism.md
    reminder: 检验围绕真实不确定性，不能为完成闭环虚构执行或反馈。

  - uncertainty: 限制被视为不可改变，或努力被视为可以克服一切
    possible_references:
      - ../methodologies/22-subjective-initiative.md
      - ../methodologies/17-independent-self-reliance.md
      - ../methodologies/15-persistence.md
    reminder: 区分现实边界和可改变条件，也允许调整目标或停止。
